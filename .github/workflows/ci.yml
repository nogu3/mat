# task check 相当（fmt:check + clippy + doc:check + test）を PR / main push で回す。
# テストは trait-level FakeConn 単体テスト + backend フリーの binary 統合テストを含む。実 chip-tool は不要。
# ble feature（bluer → libdbus）も clippy + test でコンパイルする — これが無いと
# ble.rs / commissioning.rs の BLE 経路の初コンパイルが手動 `task dist:arm64`
# = デプロイ直前になる（監査 Tier 1 ②）。実機 BLE を要するテストは
# #[ignore] 付きなのでコンパイルのみでスキップされる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読み取りだけ（チェックアウトのみで書き込む操作は無い）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install libdbus (ble feature)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (ble)
        run: cargo clippy --locked --all-targets --features ble -- -D warnings
      - name: doc (rustdoc -D warnings)
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: check (mat-device core, no I/O)
        run: cargo check --locked -p mat-device --no-default-features
      - name: test
        run: cargo test --locked
      - name: test (ble)
        run: cargo test --locked -p mat-controller --features ble
