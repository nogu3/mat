# 依存の脆弱性監査（RustSec）。コードが変わらなくても新しい advisory で落ちるよう
# 週 1 で回し、Cargo.lock / Cargo.toml を触る PR でも回す。
# 更新そのものは Renovate（renovate.json）が週 1 の lockFileMaintenance で出す。
name: audit

on:
  schedule:
    - cron: "0 22 * * 0" # 月曜 07:00 JST（Renovate の前）
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

# GITHUB_TOKEN は読み取りだけ（監査結果はジョブの成否で出すだけで書き込まない）。
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
