[workspace]
resolver = "2"
members = ["crates/mat-core", "crates/mat", "crates/matd", "crates/mat-controller", "crates/mat-native", "crates/mat-device", "crates/matv"]

[workspace.package]
version = "1.37.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/nogu3/mat"

[workspace.dependencies]
# path + version の併記は crates.io publish 用（ローカルでは path が勝ち、
# publish 時は version だけが残る）。workspace.package.version と同時に上げる。
mat-core = { path = "crates/mat-core", version = "1.37.0" }
mat-controller = { path = "crates/mat-controller", version = "1.37.0" }
mat-native = { path = "crates/mat-native", version = "1.37.0" }
mat-device = { path = "crates/mat-device", version = "1.37.0" }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
# RustCrypto 一群は mat-controller / mat-device の両方が使う。ここに集約して
# 両クレートは `{ workspace = true }` で参照する（版・feature の一致を構造で
# 保証し、バンプは 1 段で済む）。
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes = "0.9"
ccm = "0.6"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# 3 バイナリの main 冒頭で SIGPIPE を既定動作へ戻すためだけ（unix）。
libc = "0.2"

[profile.release]
strip = true
