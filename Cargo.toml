[workspace]
resolver = "2"
members = ["crates/mat-core", "crates/mat", "crates/matd", "crates/mat-controller", "crates/mat-native", "crates/mat-device", "crates/matv"]

[workspace.package]
version = "1.30.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nogu3/mat"

[workspace.dependencies]
# path + version の併記は crates.io publish 用（ローカルでは path が勝ち、
# publish 時は version だけが残る）。workspace.package.version と同時に上げる。
mat-core = { path = "crates/mat-core", version = "1.30.0" }
mat-controller = { path = "crates/mat-controller", version = "1.30.0" }
mat-native = { path = "crates/mat-native", version = "1.30.0" }
mat-device = { path = "crates/mat-device", version = "1.30.0" }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
