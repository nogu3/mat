[package]
# crates.io の `mat` は先住クレートに取られているためパッケージ名は mat-cli
# （ripgrep→rg 方式）。インストールされるバイナリ名は下の [[bin]] どおり mat。
name = "mat-cli"
description = "Matter device control CLI — drives a native Rust Matter controller in-process and emits pure structured JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["matter", "smart-home", "iot", "home-automation", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "mat"
path = "src/main.rs"

[features]
ble = ["mat-native/ble"]

[dependencies]
mat-core.workspace = true
mat-controller.workspace = true
mat-native.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
mat-native = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
async-trait.workspace = true
