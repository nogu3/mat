[package]
name = "mat-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "From-scratch pure-Rust Matter controller library — TLV, PASE/CASE, Interaction Model, mDNS, groupcast, commissioning"
keywords = ["matter", "smart-home", "iot", "commissioning", "thread"]
categories = ["network-programming"]

[features]
# BLE commissioning (bluer は libdbus にリンクするため隔離。
# 本番 mat/matd の musl クロスビルドはこの feature を使わない)
ble = ["dep:bluer", "dep:futures-util"]
# テスト専用 CASE 応答器（test_support モジュール）。プロダクションビルドには
# 入れない — dev-dependencies 経由でテストビルドのみ有効化する。
test-responder = []

[dependencies]
tokio = { version = "1", features = ["net", "time", "rt", "macros", "io-util", "sync"] }
ccm = "0.6"
aes = "0.9"
base64ct = { version = "1", features = ["alloc"] }
getrandom = { workspace = true }
sha2 = "0.11"
sha1 = "0.11"
hkdf = "0.13"
hmac = "0.13"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
socket2 = "0.6"
rustix = { version = "1", features = ["fs"] }
tracing = { workspace = true }
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }
serde_json = { workspace = true }

[dev-dependencies]
mat-controller = { path = ".", features = ["test-responder"] }
tokio = { version = "1", features = ["test-util"] }
tracing-subscriber = { workspace = true }
tempfile = "3"

[[example]]
name = "ble-scan"
required-features = ["ble"]

[[test]]
name = "live_commission_ble"
required-features = ["ble"]
