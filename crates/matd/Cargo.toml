[package]
name = "matd"
description = "Resident Matter daemon for the mat CLI — warm CASE sessions and a resident Subscribe (mat listen)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["matter", "smart-home", "iot", "daemon"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "matd"
path = "src/main.rs"

[dependencies]
mat-core.workspace = true
mat-controller.workspace = true
mat-native.workspace = true
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
mat-native = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
# start_paused=true（op 相関 / born-dead 検知テスト、Task 4）に必須。
tokio = { version = "1", features = ["test-util"] }
