[package]
name = "matv"
description = "Virtual Matter device host — a commissionable bridge with virtual devices, for testing Matter controllers without hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["matter", "smart-home", "iot", "virtual-device", "testing"]
categories = ["command-line-utilities", "simulation"]

[[bin]]
name = "matv"
path = "src/main.rs"

[dependencies]
mat-device.workspace = true
mat-controller.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
