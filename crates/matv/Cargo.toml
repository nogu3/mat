[package]
name = "matv"
description = "Virtual Matter device host CLI (M1: single self-contained node) — thin wrapper around mat-device's Device runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "matv"
path = "src/main.rs"

[dependencies]
mat-device.workspace = true
mat-controller.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time"] }

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
