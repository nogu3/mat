[package]
name = "mat-device"
description = "Matter device-side stack (PASE/CASE responder, IM server) — backend for matv (M1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["net"]
net = ["dep:tokio", "dep:mat-core", "dep:socket2"]

[dependencies]
mat-controller = { workspace = true }
mat-core = { workspace = true, optional = true }
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync"], optional = true }
# mDNS advertiser socket setup (`net::mdns`) — SO_REUSEADDR/join_multicast_v6
# need the raw socket2 API before handing the fd to tokio, same as
# mat-controller's own `dnssd::bind_mdns_socket`. Not a workspace dependency
# (only mat-controller and now mat-device use it) — version pinned to match
# mat-controller's `socket2 = "0.6"` so both resolve to one crate version.
socket2 = { version = "0.6", optional = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
# Session-key HKDF (spec §4.13.2.3), used by `core::pase` — unconditional
# (not gated behind `net`): `core` must stay I/O-free but still needs this
# crypto primitive. Versions match mat-controller's own hkdf/sha2 deps.
hkdf = "0.12"
sha2 = "0.10"
# Operational keypair generation for CSRRequest (`core::commissioning`) —
# unconditional for the same reason as hkdf/sha2 above (pure crypto, not
# I/O). Version/features match mat-controller's own p256 dependency.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }

[dev-dependencies]
mat-controller = { workspace = true, features = ["test-responder"] }
tempfile = { workspace = true }
