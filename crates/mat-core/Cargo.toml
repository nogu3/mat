[package]
name = "mat-core"
description = "Shared core for the mat Matter CLI — mat's JSON schema, error/exit-code classification, credential store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["matter", "smart-home", "iot"]
categories = ["network-programming"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# `log::init_stderr`（tracing-subscriber を使う stderr ログ初期化）。バイナリ
# （mat / matd）だけが有効化する — ライブラリ消費者に subscriber 依存を強いない。
log-init = ["dep:tracing-subscriber"]
